name: Reset Rahbar Password

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$PROD_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Reset Password in MongoDB
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa ${PROD_USER}@${PROD_HOST} 'docker exec sahiy-docs-mongo-1 mongosh sahiy_docs --eval "db.users.updateOne({ role: \"RAHBAR\" }, { \$set: { password: \"\$2a\$12\$oE2L.lK2S9BqR39z3.7QfOzH1lZ6w3tPz6E9eP5s2B8M2Z9E9E9E9\" } })"'
