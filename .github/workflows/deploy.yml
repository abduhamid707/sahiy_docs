name: Deploy Sahiy CRM to Production

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: sahiy-crm-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          test -n "$PROD_HOST" || (echo "PROD_HOST secret is required" && exit 1)
          test -n "$PROD_SSH_KEY" || (echo "PROD_SSH_KEY secret is required" && exit 1)
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$PROD_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Package and upload release
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          test -n "$PROD_USER" || (echo "PROD_USER secret is required" && exit 1)
          tar --exclude=node_modules --exclude=.next --exclude=.git --exclude=*.tar.gz --exclude='.env*' --exclude='*firebase-adminsdk*.json' --warning=no-file-changed -czf /tmp/sahiy-docs.tar.gz .
          scp -i ~/.ssh/id_rsa /tmp/sahiy-docs.tar.gz ${PROD_USER}@${PROD_HOST}:/tmp/sahiy-docs.tar.gz

      - name: Deploy with Docker Compose
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa ${PROD_USER}@${PROD_HOST} 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -f /root/sahiy-docs/.env || (echo 'Server .env file is missing' && exit 1)
          rm -rf /root/sahiy-docs-release
          mkdir -p /root/sahiy-docs-release
          tar -xzf /tmp/sahiy-docs.tar.gz -C /root/sahiy-docs-release
          rm -f /tmp/sahiy-docs.tar.gz
          cp /root/sahiy-docs/.env /root/sahiy-docs-release/.env
          chmod 600 /root/sahiy-docs-release/.env
          cd /root/sahiy-docs-release
          docker compose -p sahiy-docs --env-file .env -f docker-compose.prod.yml config --quiet
          docker compose -p sahiy-docs --env-file .env -f docker-compose.prod.yml up -d --build --remove-orphans --wait --wait-timeout 180
          rm -rf /root/sahiy-docs-previous
          mv /root/sahiy-docs /root/sahiy-docs-previous
          mv /root/sahiy-docs-release /root/sahiy-docs
          REMOTE

      - name: Production health check
        run: |
          sleep 8
          STATUS_CODE=$(curl -sS -o /dev/null -w "%{http_code}" https://crm.sahiy.uz/api/health || echo "000")
          echo "Production health status: $STATUS_CODE"
          test "$STATUS_CODE" = "200"
